<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <title>IA</title>
</head>

<body>
  <div id="container"></div>

  <div id="visor">
    <div id="chat-header"><h1>DEV●AXON</h1><h2>Calcule, codifique, aprenda e evolua.</h2></div></div>
    <div id="chat-history"></div>
    <div id="ferramentas"></div>
    <div id="visorRodape"></div>
  <!-- RODAPÉ PRINCIPAL (Três itens independentes) -->
  <div class="rodape">
    <!-- 1. Botão Citroën (Subir) -->
    <button onclick="menuRodape()" type="button" class="btn-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 11L12 5L6 11"></path>
        <path d="M18 18L12 12L6 18"></path>
      </svg>
    </button>
    <!-- 2. Container com Glow exclusivo para o Input -->
    <div class="input-glow">
      <input type="text" id="search" placeholder="Faça uma pergunta a IA">
    </div>
    
    <!-- 3. Botão Aviãozinho -->
    <button onclick="BuscaNaIA()" type="button" class="btn-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"></path>
        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
      </svg>
      
    </button>
  </div>
  <script src="/assets/script.js" type="text/javascript" charset="utf-8"></script>
  <script src="script.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
